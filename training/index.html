function cleanNumber(v,min,max){if(v==null || v==='')return null;const n=Number(v);if(!Number.isFinite(n)||n<min||n>max)throw new Error('Invalid numeric log value.');return n;}
function parseTime(v){if(!v)return null;const s=String(v).trim();if(!/^\d{1,3}:[0-5]\d(?::[0-5]\d)?(?:\.\d{1,2})?$/.test(s))return null;const p=s.split(':').map(Number);if(p.length===3&&p[1]>=60)return null;return p.reduce((a,b)=>a*60+b,0);}
function timeText(sec){if(sec==null||!Number.isFinite(sec))return '—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function sanitiseState(obj){
 if(!obj||obj.version!==1||obj.planId!==PLAN.id||!obj.logs||typeof obj.logs!=='object'||Array.isArray(obj.logs))throw new Error('This is not a backup for this training block.');
 const out=defaultState();
 for(const d of PLAN.days){const l=obj.logs[d.date];if(!l)continue;if(typeof l!=='object'||Array.isArray(l))throw new Error('Invalid session record.');
 const log={status:['planned','done','skipped'].includes(l.status)?l.status:'planned',notes:String(l.notes||'').slice(0,10000),updatedAt:String(l.updatedAt||'').slice(0,40),performedOn:/^\d{4}-\d{2}-\d{2}$/.test(l.performedOn||'')?l.performedOn:d.date,readiness:['','good','normal','tired','pain'].includes(l.readiness)?l.readiness:'',sets:{},run:{},override:'plan'};
 if(l.override==='easy')log.override='easy';else if(dayByDate(l.override)?.run&&l.override<d.date)log.override=l.override;
 for(const e of d.lift)for(let i=0;i<e.sets;i++){const id=e.id+'-'+i,s=l.sets?.[id];if(!s)continue;log.sets[id]={weight:cleanNumber(s.weight,0,500),reps:cleanNumber(s.reps,0,100),rpe:cleanNumber(s.rpe,0,10),done:!!s.done};}
 if(d.run&&l.run){log.run={km:cleanNumber(l.run.km,0,200),totalTime:String(l.run.totalTime||'').slice(0,16),workTime:String(l.run.workTime||'').slice(0,16),rpe:cleanNumber(l.run.rpe,0,10),done:!!l.run.done,splits:{}};for(const f of ['totalTime','workTime'])if(log.run[f]&&parseTime(log.run[f])===null)throw new Error('Invalid time in backup.');for(let i=0;i<12;i++)if(l.run.splits?.[i]){const val=String(l.run.splits[i]).slice(0,16);if(parseTime(val)===null)throw new Error('Invalid split in backup.');log.run.splits[i]=val;}}
 out.logs[d.date]=log;
 }
 const p=obj.prefs||{};out.prefs={week:Number.isInteger(p.week)&&p.week>=1&&p.week<=13?p.week:activeWeek(),tab:['today','week','progress','guide'].includes(p.tab)?p.tab:'today',sound:!!p.sound,vibration:p.vibration!==false,keepAwake:!!p.keepAwake};return out;
}

ar-plan" style="width:${plannedKm(w.n)/maxkm*100}%"></span><span class="bar-actual" style="width:${actualKm(w.n)/maxkm*100}%"></span></div><span class="bar-value">${fmt(actualKm(w.n))} / ${fmt(plannedKm(w.n))} km</span></div>`).join('')}</div><p class="help">Logs are grouped by the scheduled week, even when a performed date differs.</p></section><section class="section"><div class="section-head"><h2>Your training history</h2><button class="btn compact" data-action="export-csv">Export CSV</button></div>${logs.length?logs.map(d=>{const l=getLog(d.date),sets=Object.values(l.sets||{}).filter(s=>s.done).length;return `<div class="history-row"><span class="badge">${dateFmt(d.date)}</span><div class="details"><button data-action="session" data-date="${d.date}"><strong>${esc(d.title)}</strong></button><p>${l.status==='done'?'Completed':l.status==='skipped'?'Skipped':'In progress'}${sets?' · '+sets+' sets':''}${runRecorded(d,l)&&l.run.km!=null?' · '+fmt(l.run.km)+' km':''}${l.run?.workTime?' · 3 km '+esc(l.run.workTime):''}</p>${l.notes?`<p>${esc(l.notes.slice(0,180))}</p>`:''}</div><button class="iconbtn" data-action="session" data-date="${d.date}" aria-label="Edit ${dateFmt(d.date)}">↗</button></div>`;}).join(''):'<div class="empty">Your first session starts the story.<br>Open a workout, tick your sets, and record what you did.</div>'}</section><div class="callout section"><strong>Back up your training.</strong><p style="margin-top:6px">Clearing browser data or changing devices can remove these logs. Export JSON for a complete, re-importable backup; CSV is for reviewing your history.</p><button class="btn compact padtop" data-action="export">Export full backup</button></div>`;}

function renderGuide(){return `<div class="page-intro"><p class="eyebrow">The rules behind the plan</p><h1>Train. Adjust. Repeat.</h1><p class="intro-copy">Targets give direction. Your effort determines the load.</p></div>${guideBlock('Your baseline and the two targets',`<p><strong>90 kg bodyweight; approximately 15 km/week running.</strong> Current times: 14:20 for 3 km and 25:00 for 5 km, with something left on the 5 km. Current deadlift: 160 kg for a single at about RPE 8.5. Previous best: 180 kg about two years ago.</p><p><strong>13:00 on 26 December; 190 kg on 31 December.</strong> These are stretch targets, not guaranteed outcomes. 160 kg is not being treated as your true 1RM. The conservative opening and conditional later weights are retained.</p><p>87 days, organised into 13 calendar weeks—not 13 full weeks. The first week starts on Tuesday. Do not repeat a hard deadlift test within 48 hours just to fit the calendar.</p>`,true)}${guideBlock('The normal training week',`<table class="mini-table"><tbody><tr><td>Monday</td><td>Heavier deadlift + modest upper-body work</td></tr><tr><td>Tuesday</td><td>Easy running</td></tr><tr><td>Wednesday</td><td>Intervals</td></tr><tr><td>Thursday</td><td>Technique deadlift + maintenance squat + easy run</td></tr><tr><td>Friday</td><td>Rest</td></tr><tr><td>Saturday</td><td>Controlled tempo or easy running</td></tr><tr><td>Sunday</td><td>Rest</td></tr></tbody></table><p>On combined days, lift first and keep the run easy. Separate by several hours where practical. Weeks 1, 8, 12 and 13 have specific exceptions in the programme.</p>`)}${guideBlock('Running effort, paces and warm-up',`<p><strong>Easy:</strong> start around 6:00–6:45/km, slower if needed. Full sentences should remain comfortable.</p><p><strong>Tempo:</strong> RPE 6–7. Short phrases should be possible; finish knowing you could continue. Pace ranges are guides, not orders.</p><p><strong>Intervals:</strong> aim to finish with one more good repetition available. Walk or jog the listed recoveries.</p><p><strong>Warm-up for quality sessions and tests:</strong> approximately 1.5 km easy, a few dynamic movements and three relaxed 15-second accelerations. Cool down at least 500 m. All listed running totals include warm-up, recoveries and cooldown. Allow a little distance variation rather than cutting your warm-up to hit an exact number.</p><table class="mini-table"><tbody><tr><td>Goal kilometre</td><td>4:20</td></tr><tr><td>Goal 400 m</td><td>1:44</td></tr><tr><td>Goal 600 m</td><td>2:36</td></tr><tr><td>Goal 800 m</td><td>3:28</td></tr></tbody></table>`)}${guideBlock('Deadlift effort, warm-up and accessories',`<p><strong>RPE 7 ≈ three repetitions left; RPE 8 ≈ two; RPE 9 ≈ one.</strong> These are estimates. The heavy single is practice, not a weekly maximum.</p><table class="mini-table"><tbody><tr><td>Heavy single</td><td>Usually RPE 7–8. Absolute cap 8.5 in weeks 9–11; week 12 cap 8.</td></tr><tr><td>Back-off sets</td><td>RPE 8 maximum, including the last set.</td></tr><tr><td>Technique deadlift</td><td>RPE 6 or below. Reset every repetition.</td></tr><tr><td>Squat</td><td>RPE 6–7. Maintain, rather than chase another maximum.</td></tr><tr><td>Upper-body work</td><td>About two repetitions in reserve.</td></tr></tbody></table><p><strong>Example warm-up before 140 kg:</strong> 60 × 5 → 90 × 3 → 110 × 2 → 125 × 1. Warm-up sets are additional to the logged work sets.</p><p>Rest 3–5 minutes between substantial deadlift sets and about 2 minutes between accessory sets. Choose accessory loads by effort, since your starting weights were not provided. Pull-up repetitions are submaximal; assistance is fine.</p>`)}${guideBlock('When to change a session',`<p><strong>Heavy single reaches the cap early:</strong> stop increasing it. Reduce back-off load by about 5–10% and remove one set if needed. Edit actual weights directly in the log. Repeat the last successful level next week rather than obeying the date.</p><p><strong>Two lifting sessions going backwards:</strong> take an additional light week, roughly following week 4, before resuming.</p><p><strong>Intervals deteriorate or your stride becomes strained:</strong> stop the repetitions and cool down. Repeat that manageable session rather than progressing.</p><p><strong>Fatigue carries between days:</strong> first replace Saturday tempo with easy running. If Monday repeatedly compromises Wednesday, remove one Monday back-off set. The session’s “Adjust running prescription” menu can swap quality work for easy running or repeat an earlier workout.</p><p><strong>Missed session:</strong> skip it. Do not stack hard sessions together. Count sport, hard unit physical training and loaded marches as additional training stress.</p><p><strong>Sharp pain or altered gait/lifting mechanics:</strong> stop. Persistent or recurring pain needs assessment, not another progression.</p>`)}${guideBlock('Checkpoints and final test strategy',`<p><strong>25 November · 3 km checkpoint.</strong> Roughly 13:35–13:50 would be encouraging, not mandatory. Still around 14 minutes or slower, or repeated all-out intervals? Repeat manageable week 6–7 prescriptions before forcing faster work.</p><p><strong>Mid-December:</strong> controlled kilometre repetitions near 4:20 and a clean 175–180 kg single with something left are readiness indicators—not guarantees.</p><p><strong>26 December · 3 km test.</strong> Use a flat, measured course. A 12:59 pacing example is 4:22 / 4:20 / 4:17. Do not sprint the opening kilometre.</p><p><strong>31 December · deadlift test.</strong> If training and warm-ups support it: 170 → 180 → 190 kg, with 4–6 minutes rest. 190 is conditional on a convincing 180. A maximal grind or technical breakdown means a smaller increase or stopping. Use the same lift style and equipment standard as your starting single.</p>`)}${guideBlock('Recovery targets',`<p><strong>Bodyweight:</strong> stay roughly around 90 kg rather than combining this block with an aggressive cut or rapid gain.</p><p><strong>Protein:</strong> approximately 150–180 g/day. Include carbohydrate-rich meals around demanding sessions.</p><p><strong>Sleep:</strong> protect roughly 8–9 hours in bed where practical. Unusually poor sleep or exhausting work calls for lower loads and controlled running—not compensation with more work.</p>`)}${guideBlock('Using the app on Android',`<p><strong>After hosting:</strong> open the app in Chrome or Samsung Internet. Use the browser menu’s Install app / Add to Home screen option, or the install button in Settings when available.</p><p><strong>Offline:</strong> open the hosted app online once and wait for “Offline ready”. The programme then remains available without a network connection. A standalone downloaded HTML preview is not the installed PWA.</p><p><strong>Logs:</strong> saved automatically to this browser, on this device. There is no login or cross-device sync. Export JSON weekly and before clearing browser data or changing devices. Do not assume private browsing preserves your data.</p><p><strong>Timer:</strong> counts against the clock, so elapsed time stays correct when you return. Alarms are not guaranteed if Android suspends the app or locks the screen. Keep the app visible and enable Keep screen awake where supported.</p><p><strong>Privacy:</strong> no analytics or external services. Your personal starting figures are embedded in the published app; logs are stored locally. A public URL is not password protection.</p>`)}<button class="btn full" data-action="print">Print the complete programme</button><p class="privacy-foot">Programme assembled from your agreed training block.<br>Use exercise guidance within your own experience and recovery limits.</p>`;}

 else if(a==='close-dialog')closeDialog(b.closest('dialog'));
 else if(a==='settings')openSettings();
 else if(a==='check-set'){const row=b.closest('.set-row'),s=syncSet(row);if(!s)return;if(!s.done&&!(s.reps>0)){toast('Enter the repetitions you completed first.');$('.set-input[data-key="reps"]',row).focus();return;}s.done=!s.done;row.classList.toggle('is-done',s.done);b.setAttribute('aria-pressed',String(s.done));stamp(sessionDate);}
 else if(a==='use-distance'){const l=editLog(sessionDate);l.run.km=runFor(dayByDate(sessionDate)).km;$('#actual-km').value=l.run.km;$('#pace-result').textContent=paceFeedback(l.run);stamp(sessionDate);}
 else if(a==='run-done'){if(!validateSession())return;const l=editLog(sessionDate);l.run.done=!l.run.done;stamp(sessionDate);renderSession();}
 else if(a==='complete-session'){if(!validateSession())return;const l=editLog(sessionDate);l.status=l.status==='done'?'planned':'done';stamp(sessionDate);renderSession();toast(l.status==='done'?'Session completed. Actuals remain exactly as logged.':'Session reopened.');}
 else if(a==='skip-session'){const l=editLog(sessionDate);l.status=l.status==='skipped'?'planned':'skipped';stamp(sessionDate);renderSession();}
 else if(a==='export')exportBackup();
 else if(a==='export-csv')exportCsv();
 else if(a==='export-raw')downloadFile('gyubin-unreadable-backup.json',unreadableRaw,'application/json');
 else if(a==='import')$('#import-file').click();
 else if(a==='persist'){try{const ok=await navigator.storage?.persist?.();toast(ok?'Persistent storage granted. Still keep regular backups.':'Persistent storage was not granted. Keep regular backups.');}catch(_){toast('Storage protection is unavailable. Export regular backups.');}}
 else if(a==='reset'){if(!confirm('Delete this block’s local workout logs and reset its timer? This cannot be undone. Export a JSON backup first.'))return;state=defaultState();timer={duration:180,remaining:180,running:false,end:null};releaseWake();unreadableRaw='';storageOK=true;save();saveTimer();render();openSettings();updateTimer();toast('Workout logs reset.');}
 else if(a==='print'){$('#print-area').innerHTML=renderPrint();window.print();}
 else if(a==='install')await installApp();
 else if(a==='timer')openTimer();
 else if(a==='rest-timer'||a==='timer-preset')openTimer(Number(b.dataset.seconds));
 else if(a==='timer-custom'){const i=$('#timer-custom');if(!i.checkValidity()||!Number(i.value)){i.reportValidity();return;}openTimer(Math.round(Number(i.value)));}
 else if(a==='timer-start'){prepareAudio();if(timer.running){timer.remaining=timerLeft();timer.running=false;timer.end=null;releaseWake();}else{if(timer.remaining<=0)timer.remaining=timer.duration;timer.end=Date.now()+timer.remaining*1000;timer.running=true;requestWake();}saveTimer();updateTimer();}
 else if(a==='timer-reset'){timer.remaining=timer.duration;timer.running=false;timer.end=null;releaseWake();saveTimer();updateTimer();}
});
document.addEventListener('input',ev=>{const f=ev.target;if(f.matches('.set-input')&&sessionDate){if(!f.checkValidity())return;const l=editLog(sessionDate);l.sets[f.dataset.set]??={};l.sets[f.dataset.set][f.dataset.key]=f.value===''?null:Number(f.value);stamp(sessionDate);const ex=dayByDate(sessionDate).lift.find(e=>f.dataset.set.startsWith(e.id+'-'));if(ex)updateSetFeedback(dayByDate(sessionDate),ex);}
 else if(f.matches('[data-log-field]')&&sessionDate){editLog(sessionDate)[f.dataset.logField]=f.value;stamp(sessionDate);if(f.dataset.logField==='readiness')$('#readiness-note').hidden=f.value!=='pain';}
 else if(f.matches('[data-run-field]')&&sessionDate){const key=f.dataset.runField,l=editLog(sessionDate);if(['totalTime','workTime'].includes(key)){const valid=!f.value||parseTime(f.value)!==null;$('#error-'+key).textContent=valid?'':'Use mm:ss (for example 14:20).';if(!valid)return;l.run[key]=f.value;}else{if(!f.checkValidity())return;l.run[key]=f.value===''?null:Number(f.value);}stamp(sessionDate);$('#pace-result').textContent=paceFeedback(l.run);}
 else if(f.matches('[data-split]')&&sessionDate){const valid=!f.value||parseTime(f.value)!==null;$('#split-error').textContent=valid?'':'Use m:ss for each split.';if(!valid)return;const l=editLog(sessionDate);l.run.splits??={};l.run.splits[f.dataset.split]=f.value;stamp(sessionDate);}
});
document.addEventListener('change',async ev=>{const f=ev.target;
 if(f.id==='week-select'){state.prefs.week=Number(f.value);save();updateHash();render();}
 else if(f.matches('[data-pref]')){state.prefs[f.dataset.pref]=f.checked;save();if(f.dataset.pref==='keepAwake'){if(f.checked)requestWake();else releaseWake();}}
 else if(f.id==='run-override'&&sessionDate){const l=editLog(sessionDate);if(Object.keys(l.run||{}).length&&!confirm('Change this running prescription? This clears its running result and splits, but keeps lifting logs and notes.')){f.value=l.override||'plan';return;}l.override=f.value;l.run={};if(l.status==='done')l.status='planned';stamp(sessionDate);renderSession();}
 else if(f.id==='import-file'&&f.files[0]){const file=f.files[0];try{if(file.size>2*1024*1024)throw new Error('Backup is too large (maximum 2 MB).');const incoming=sanitiseState(JSON.parse(await file.text()));if(confirm(`Import ${Object.keys(incoming.logs).length} session records? This replaces this block’s current local logs. Export a backup first.`)){state=incoming;storageOK=true;unreadableRaw='';save();render();if($('#settings-dialog').open)openSettings();toast('Backup imported.');}}catch(e){toast('Import failed: '+e.message);}finally{f.value='';}}
});
$$('dialog').forEach(d=>d.addEventListener('close',()=>{if(d.id==='session-dialog'&&!d.open){sessionDate=null;render();}if(!$$('dialog[open]').length)document.body.classList.remove('body-lock');}));
window.addEventListener('hashchange',()=>{readRoute();render();});
window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev;});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('App installed. Your logs remain on this device.');});
document.addEventListener('visibilitychange',()=>{updateTimer();if(document.visibilityState==='visible'){if(TODAY!==todayISO()){TODAY=todayISO();render();}requestWake();}});
window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){if($('#session-dialog').open){toast('Another tab changed your logs. Close this session and reload to avoid conflicts.');return;}try{state=sanitiseState(JSON.parse(ev.newValue));render();}catch(_){}}});
if(DEPLOY_BUILD&&'serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;updateConnection();}).catch(()=>{offlineReady=false;});
readRoute();render();updateTimer();setInterval(updateTimer,250);
</script>
