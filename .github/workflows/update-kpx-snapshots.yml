name: Update KPX public snapshots

on:
  push:
    paths:
      - "scripts/update-kpx-snapshots.mjs"
      - ".github/workflows/update-kpx-snapshots.yml"
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kpx-public-snapshots
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch official KPX pages
        run: node scripts/update-kpx-snapshots.mjs
      - name: Publish changed snapshots
        run: |
          if git diff --quiet -- data/kpx-live.json data/kpx-system.json; then
            echo "KPX snapshots are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kpx-live.json data/kpx-system.json
          git commit -m "data: refresh KPX public snapshots"
          git pull --rebase
          git push
